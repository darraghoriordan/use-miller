name: Publish create-miller
on:
    push:
        branches:
            - main
            - release/*
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1 v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9 v4
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0 v6
              with:
                  node-version-file: ".nvmrc"
                  registry-url: "https://registry.npmjs.org"
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - run: pnpm run test
            - run: pnpm run build
            - name: Release
              env:
                  NPM_CONFIG_PROVENANCE: true
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
